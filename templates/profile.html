<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil - SideJobBanda</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-[#f1f6fa] min-h-screen">
    {% include 'navbar.html' %}

    <!-- Profil Section -->
    <div class="bg-[#1f3a60] text-white mx-auto mt-10 rounded-2xl shadow-lg w-[90%] max-w-5xl p-10">
      <h2 class="text-2xl font-bold mb-6">Profil</h2>

      <form method="POST" action="{{ url_for('profile') }}" 
            class="grid grid-cols-2 gap-6 bg-[#f1f6fa] text-gray-900 rounded-xl p-8">
        
        <!-- Nama Lengkap -->
        <div>
          <label for="full_name" class="block font-medium mb-1 text-[#005F9E]">Nama Lengkap</label>
          <input
            type="text"
            id="full_name"
            name="full_name"
            value="{{ user.full_name or '' }}"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 
                   focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <!-- Username -->
        <div>
          <label for="username" class="block font-medium mb-1 text-[#005F9E]">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            value="{{ user.username }}"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 
                   focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="block font-medium mb-1 text-[#005F9E]">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            value="{{ user.email }}"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 
                   focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <!-- No Telepon -->
        <div>
          <label for="phone" class="block font-medium mb-1 text-[#005F9E]">No Telepon</label>
          <input
            type="text"
            id="phone"
            name="phone"
            value="{{ user.phone }}"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 
                   focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <!-- Alamat -->
        <div>
          <label for="address" class="block font-medium mb-1 text-[#005F9E]">Alamat</label>
          <input
            type="text"
            id="address"
            name="address"
            value="{{ user.address }}"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 
                   focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <!-- Detail -->
        <div class="col-span-2">
          <label for="details" class="block font-medium mb-1 text-[#005F9E]">Alamat Detail</label>
          <textarea
            id="details"
            name="details"
            rows="3"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 
                   focus:outline-none focus:ring-2 focus:ring-blue-500"
          >{{ user.details }}</textarea>
        </div>

        <!-- Tombol Simpan -->
        <div class="col-span-2 flex justify-end">
          <button
            type="submit"
            class="bg-[#005F9E] text-white font-semibold px-6 py-2 rounded-lg 
                   hover:bg-[#004a7c] transition"
          >
            Simpan Perubahan
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
